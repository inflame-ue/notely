name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Code
        uses: actions/checkout@v4

      - name: Setup the Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Build the App
        run: ./scripts/buildprod.sh

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build the docker image and push it Google AR
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-498310/notely-ar-repo/inflameue/notely:latest
